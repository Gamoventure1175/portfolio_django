{%block content%}
<div>
    <h1>Welcome to Blogs!</h1>
    <p>This is the place where you add and see all your Blogs</p>
    {% for blog in blogs %}
    <div class="post-entry">
    <h2><a href="">{{ blog.title }}</a></h2>
    <p>Author: {{ blog.author }}</a>
    <p>{{ blog.body }}</p>
    </div>
    {% endfor %}
</div>
{%endblock content%}
